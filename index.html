<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76b7e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wind Field">
<title>Wind Field</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="wind-style.css">
</head>
<body>
<div id="viewport">
  <div id="scroller"><div id="stage"><canvas id="scene"></canvas><div class="panelSnap p1"></div><div class="panelSnap p2"></div><div class="panelSnap p3"></div></div></div>
  <div class="infoTop"><div class="appTitle">Wind Field</div><button class="summary" id="summaryBtn"><span class="summaryLine" id="summaryLine">Loading…</span><span class="summaryCaret">⌃</span></button></div>
  <div class="detailCard" id="detailCard">
    <div class="panelHead"><div><div class="panelLoc" id="detailLoc">Loading…</div><div class="condition" id="condition">—</div></div><button class="panelClose" id="detailClose">×</button></div>
    <div class="primaryLine"><div class="primaryValue"><strong id="speed">--</strong><span>km/h</span></div><div class="from" id="fromText">From --</div></div>
    <div class="stats"><div class="stat"><span>Gust</span><strong id="gust">-- km/h</strong></div><div class="stat"><span>Direction</span><strong id="direction">--°</strong></div></div>
    <div class="panelFoot"><div class="updated" id="updated">Updated --</div><button class="changeBtn" id="changeLocationBtn">Change location</button></div>
    <div class="picker" id="picker"><div class="fieldLabel">Country</div><select id="countrySelect"></select><div class="fieldLabel">Location</div><select id="locationSelect"></select><div class="pickerButtons"><button id="applyLocationBtn">Use location</button></div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i></div>

  <div class="windDirDock">
    <div class="windDirCard" id="windDirCard" aria-hidden="true">
      <strong id="windDirToward">Toward --</strong>
      <span id="windDirFrom">From --</span>
    </div>
    <button class="windDirBtn" id="windDirBtn" type="button" aria-label="Show wind direction" aria-expanded="false">
      <span class="windDirNorth">N</span>
      <span class="windDirArrow" id="windDirArrow">↑</span>
    </button>
  </div>

  <div class="mailOverlay" id="mailOverlay" aria-hidden="true">
    <article class="mailPaper" id="mailPaper" role="dialog" aria-modal="true" aria-label="A letter for you">
      <button class="mailClose" id="mailClose" aria-label="Close letter">×</button>
      <div class="mailGreeting" id="mailGreeting">Dear You,</div>
      <div class="mailBody" id="mailBody"></div>
      <div class="mailClosing" id="mailClosing">Yours sincerely.</div>
    </article>
  </div>
</div>
<script src="wind-scene.js"></script>
<script src="wind-effects.js"></script>
<script src="wind-polish.js"></script>
<script src="wind-mail.js"></script>
<script src="wind-weather.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
  });
}
</script>
</body>
</html>
